# =============================================================================
# Client Pix - One-Command Install (Local/LAN via Nginx, no HTTPS)
# =============================================================================
# Downloaded by install.sh when no domain is provided.
# Access via http://localhost or http://<your-server-ip>
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx - Reverse Proxy (HTTP only, for LAN/NAS access)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clientpix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      POSTGRES_DB: ${POSTGRES_DB:-clientpix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clientpix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/aneeshsoni/client-pix-backend:latest
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Client Pix}
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clientpix}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clientpix}
      UPLOAD_DIR: /app/uploads
      WEB_MAX_DIMENSION: ${WEB_MAX_DIMENSION:-2400}
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ---------------------------------------------------------------------------
  # Next.js Frontend
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/aneeshsoni/client-pix-frontend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
